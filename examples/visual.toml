name = "VisualWorld"
description = "Global physical scale boundaries for condensed-matter properties"

[properties.energy_gap]
# Unit: eV (electron-volts). Metals = 0.0 eV, Diamond = 5.5 eV, Quartz SiO2 = 9.0 eV, Insulators <= 10.0 eV
min = 0.0
max = 10.0

[properties.electron_density]
# Unit: 10^28 m^-3 (atomic packing scale). Vacuum = 0.0, Gold = 5.9, Aluminum = 18.1
min = 0.0
max = 20.0

[properties.roughness]
# Unit: dimensionless microfacet RMS slope alpha. 0.0 = specular mirror, 1.0 = Lambertian diffuse
min = 0.0
max = 1.0

[properties.excitation]
# Unit: dimensionless fractional population N_excited / N_total. 0.0 = ground state, 1.0 = inversion
min = 0.0
max = 1.0
